server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Servir archivos estáticos del frontend
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy reverso a la API en Go
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
        proxy_read_timeout 60s;
    }

    # Assets estáticos: sin build hash en el nombre de archivo, así que
    # "immutable" es peligroso — un rebuild puede cambiar el contenido bajo
    # la misma URL y el navegador nunca volvería a pedirlo. no-cache obliga
    # a revalidar con ETag en cada carga (sigue habiendo 304 si no cambió).
    location ~* \.(css|js|png|jpg|ico|woff2)$ {
        add_header Cache-Control "no-cache";
    }
}
