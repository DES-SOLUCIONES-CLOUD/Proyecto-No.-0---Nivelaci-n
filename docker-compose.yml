services:
  # ─── Base de datos PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: okf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-okf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okfpassword}
      POSTGRES_DB: ${POSTGRES_DB:-okf}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okf} -d ${POSTGRES_DB:-okf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okf_network

  # ─── Redis (cola de mensajes) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: okf_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okf_network

  # ─── MinIO (almacenamiento de objetos) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: okf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # consola web MinIO (opcional, para debugging)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - okf_network

  # ─── API Backend en Go ───────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: okf_api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      GIN_MODE: ${GIN_MODE:-release}
      POSTGRES_URL: ${POSTGRES_URL:-postgres://okf:okfpassword@postgres:5432/okf?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-originals}
      MINIO_BUCKET_BUNDLES: ${MINIO_BUCKET_BUNDLES:-bundles}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-insecure-dev-jwt-secret-CHANGE-ME-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okf_network

  # ─── Worker en Go ────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: okf_worker
    restart: unless-stopped
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://okf:okfpassword@postgres:5432/okf?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_ORIGINALS: ${MINIO_BUCKET_ORIGINALS:-originals}
      MINIO_BUCKET_BUNDLES: ${MINIO_BUCKET_BUNDLES:-bundles}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep worker-server || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okf_network

  # ─── Frontend + Nginx (proxy reverso) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: okf_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - okf_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  okf_network:
    driver: bridge
